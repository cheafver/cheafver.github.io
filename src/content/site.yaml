# ============================================================
#  Ferian Bagaskara portfolio: THE ONLY FILE YOU NEED TO EDIT
#  Edit on GitHub, commit to main, and the site redeploys.
#  Anything set to "" (empty) shows as "coming soon" on the site.
# ============================================================

settings:
  # Keep true while placeholders remain, so search engines skip the draft.
  noindex: true
  siteUrl: https://cheafver.github.io   # your site address, no trailing slash; canonical and og:image are built from this
  lang: en
  # Leave false during colleague review. At launch, true hides any link that is still "" instead of showing "coming soon".
  hidePlaceholders: false

profile:
  name: Ferian Bagaskara
  headline: Network & Cloud Network Engineer
  tagline: Hybrid and multi-cloud networking across on-prem, AWS, and GCP.
  availability: Open to remote & international roles
  location: Based in Indonesia · Any time zone
  headshot: ""   # optional: "" shows no photo. Or a path like /img/headshot.webp (file in public/img/)
  cvUrl: "/cv/cv-draft.pdf"   # DRAFT CV (placeholders visible). Swap to /cv/ferian-bagaskara-cv.pdf before noindex: false; the build refuses a draft otherwise.

contact:
  # Stored split so the full address never appears as plain text in the HTML.
  emailUser: ferianbagaskara
  emailDomain: gmail.com
  linkedinUrl: "https://www.linkedin.com/in/ferianbagaskara/"
  # Optional line above the contact buttons; leave "" to show just "Contact".
  heading: "Hiring for cloud networking? Let's talk."

